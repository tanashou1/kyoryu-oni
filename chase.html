<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9f6ec">
<meta name="description" content="大きなボタンをぽん！2歳から遊べる、やさしい恐竜の追いかけっこ。時間制限もゲームオーバーもありません。">
<title>きょうりゅう おいかけっこ</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f9f6ec;color:#304d3e;font-family:ui-rounded,'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:4px solid #355fbb;outline-offset:5px}.app{max-width:1060px;margin:auto;padding:22px 26px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.sound{border:1px solid #d9dfcf;background:#fffdf6;border-radius:24px;padding:12px 16px;font-size:14px;color:#425d46;min-height:48px}h1{font-size:clamp(26px,5vw,43px);letter-spacing:.07em;text-align:center;margin:23px 0 8px;line-height:1.4}.world{position:relative;border:7px solid #fffdf6;border-radius:32px;overflow:hidden;background:#dff2ed;box-shadow:0 8px 0 #ececde}canvas{display:block;width:100%;aspect-ratio:1.9;max-height:min(440px,65svh)}.status{position:absolute;left:50%;top:16px;transform:translateX(-50%);border-radius:25px;background:#fffdf3ef;padding:11px 22px;white-space:nowrap;font-weight:800;font-size:clamp(16px,3vw,23px);box-shadow:0 3px 0 #385b3910}.progress{display:flex;justify-content:center;gap:13px;margin:22px 0 14px}.dot{width:14px;height:14px;background:#e0e2d3;border-radius:50%;transition:background .2s,transform .2s}.dot.on{background:#eeab55;transform:scale(1.13)}.controls{text-align:center}.go{min-height:103px;min-width:260px;max-width:100%;padding:13px 44px;border:0;border-radius:32px;background:#efb45f;color:#3e4931;box-shadow:0 7px 0 #cd9041;font-size:29px;font-weight:900;letter-spacing:.08em;transition:transform .1s,box-shadow .1s}.go:active{transform:translateY(5px);box-shadow:0 2px 0 #cd9041}.go svg{width:37px;height:39px;vertical-align:middle;margin-right:14px}.restart{display:block;margin:15px auto 0;background:none;border:0;color:#78836c;text-decoration:underline;padding:10px;font-size:13px}@media(max-width:600px){.app{padding:16px 12px}.sound{font-size:12px;padding:10px}h1{margin-top:23px}canvas{aspect-ratio:1.15}.world{border-width:5px;border-radius:25px}.status{top:14px;padding:10px 15px}.go{width:90%;min-height:106px;padding:13px 18px;font-size:24px;letter-spacing:.02em;white-space:nowrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-height:500px) and (orientation:landscape){.app{padding-block:8px}h1{font-size:24px;margin:4px 0}.game-nav a,.sound{min-height:38px;padding-block:4px}.progress{margin:14px 0 8px}.go{min-height:54px;padding-block:4px;font-size:22px}.go svg{width:26px;height:26px}.restart{margin-top:6px}}

.game-nav a{display:inline-flex;align-items:center;min-height:48px;padding:8px 13px;border-radius:16px;background:#fffdf6;color:#426a50;text-decoration:none;font-weight:bold}.sound{font-size:20px!important}.go:disabled{background:#c7d6b9;color:#4d674a;box-shadow:0 7px 0 #a3b395;cursor:default}.status{width:max-content;max-width:95%;white-space:normal;text-align:center;font-size:clamp(15px,2.6vw,22px)}.egg-scene{touch-action:none;cursor:grab}.egg-scene:active{cursor:grabbing}.pet-guide{position:absolute;top:48%;left:50%;pointer-events:none;text-align:center;animation:stroke-hand 2.3s ease-in-out infinite;color:#5c6141;font-weight:bold;text-shadow:0 1px #fff}.pet-guide span{display:block;font-size:47px;filter:drop-shadow(0 2px 2px #6d604b30)}.pet-guide small{background:#fff9e6e8;border-radius:18px;padding:7px 13px;white-space:nowrap;display:block}.pet-guide[hidden]{display:none!important}@keyframes stroke-hand{0%,100%{transform:translate(-85%,-8%) rotate(-13deg)}50%{transform:translate(-5%,8%) rotate(8deg)}}@media(max-width:600px){.pet-guide span{font-size:40px}}@media(prefers-reduced-motion:reduce){.pet-guide{animation:none;transform:translate(-50%,-10%)}}
.world,.world *{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.world canvas:focus:not(:focus-visible){outline:none}.world canvas:focus-visible{outline:3px solid #71905b;outline-offset:-5px}</style>
<link rel="stylesheet" href="clear-v5.css"></head>
<body>
<main class="app">
<header class="game-nav"><a href="./?v=7">← メニュー</a><button class="sound" id="sound" aria-label="おと" aria-pressed="false">🔇</button></header><h1>おいかけっこ</h1>
<section class="world" aria-label="緑の恐竜が黄色い恐竜を追いかける草原"><canvas id="scene" aria-label="にこにこした恐竜のおともだち"></canvas><div class="status" id="status" role="status" aria-live="polite">タッチ！</div></section>

<div class="progress" aria-label="お友だちに近づくほど足あとが増えます" id="progress"></div>
<div class="controls"><button class="go" id="go"><svg viewBox="0 0 40 44" aria-hidden="true"><g fill="currentColor"><ellipse cx="20" cy="30" rx="12" ry="11" transform="rotate(-10 20 30)"/><ellipse cx="7" cy="15" rx="5" ry="7" transform="rotate(-25 7 15)"/><ellipse cx="19" cy="8" rx="5" ry="7"/><ellipse cx="31" cy="13" rx="5" ry="7" transform="rotate(25 31 13)"/></g></svg><span id="label">あそぶ！</span></button><button class="restart" id="restart" hidden>はじめから</button></div>

</main>
<script src="clear-v5.js?v=7"></script><script src="scene-layout-v5.js"></script><script src="wildlife-cg-v3.js"></script>
<script>
'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),go=document.querySelector('#go'),label=document.querySelector('#label'),statusText=document.querySelector('#status'),restart=document.querySelector('#restart'),sound=document.querySelector('#sound');
let animal=Dinos.pick(),partner=Dinos.pick(animal);
function chooseAnimals(){animal=Dinos.pick(animal);partner=Dinos.pick(animal)}
// One tap per second closes the gap; two taps per second catches in about 5 seconds.
const START_GAP=365,MAX_GAP=440,TAP_DISTANCE=48,ESCAPE_SPEED=24;
let state='ready',gap=START_GAP,runDistance=0,position=0,target=0,last=0,bounce=0,soundOn=false,audio;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dots=Array.from({length:6},()=>{let d=document.createElement('span');d.className='dot';document.querySelector('#progress').append(d);return d});
function tone(win=false){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();(win?[523,659,784]:[392,523]).forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.075,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.25)})}catch{}}
sound.onclick=()=>{soundOn=!soundOn;sound.textContent=soundOn?'🔊':'🔇';sound.setAttribute('aria-pressed',String(soundOn));if(soundOn)tone()};
function updateProgress(){const progress=Math.max(0,Math.min(1,1-gap/START_GAP));dots.forEach((d,i)=>d.classList.toggle('on',state==='won'||i<Math.floor(progress*6)));document.querySelector('#progress').setAttribute('aria-label',state==='won'?'お友だちに追いつきました':`お友だちへの近づき度 ${Math.round(progress*100)}パーセント`)}
function reset(){ClearEffect.hide();chooseAnimals();go.disabled=false;canvas.setAttribute('aria-label',animal.name+'が'+partner.name+'を追いかけます。画面をタッチすると進みます');state='ready';gap=START_GAP;runDistance=0;target=0;position=0;bounce=0;last=performance.now();label.textContent='あそぶ！';statusText.textContent='タッチ！';restart.hidden=true;updateProgress();draw(0)}
function start(){reset();state='playing';label.textContent='ぽん！';statusText.textContent='ぽんぽん！';restart.hidden=false;tone()}
restart.onclick=reset;
function chaseTap(){if(state==='won')return;if(state==='ready'){start();return}gap=Math.max(0,gap-TAP_DISTANCE);target=1-gap/START_GAP;bounce=1;tone(gap===0);if(gap===0){state='won';ClearEffect.show(()=>start());go.disabled=true;label.textContent='タッチ！';statusText.textContent='つかまえた！';}else{statusText.textContent=gap<150?'あとすこし！':'ぽんぽん！'}updateProgress()};
go.onclick=chaseTap;
const chaseWorld=document.querySelector('.world');chaseWorld.style.touchAction='manipulation';chaseWorld.style.cursor='pointer';canvas.tabIndex=0;canvas.setAttribute('aria-label','恐竜の画面をタッチして追いかけよう。Enterまたはスペースでも進めます。');
chaseWorld.addEventListener('pointerdown',e=>{if(e.button!==0||state==='won')return;e.preventDefault();chaseTap()});
canvas.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();chaseTap()}});
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function path(points,c){ctx.fillStyle=c;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
function cloud(x,y,s){SceneLayout.at(ctx,x,y,s,()=>{ellipse(0,0,36,13,'#fffdf2');ellipse(-12,-8,19,15,'#fffdf2');ellipse(11,-13,20,19,'#fffdf2')})}
function dino(x,y,s,color,belly,walk,friend=false){Dinos.draw(ctx,x,y,s,friend?partner:animal,walk)}
function draw(t){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const sx=w/900,sy=h/450;ctx.save();ctx.scale(sx,sy);ctx.fillStyle='#dff2ed';ctx.fillRect(0,0,900,450);SceneLayout.at(ctx,754,81,1,()=>ellipse(0,0,32,32,'#f4cf79'));cloud(151,89,.9);cloud(545,108,.75);ellipse(160,370,300,165,'#bbd9ab');ellipse(702,383,370,182,'#c9dfaf');ellipse(428,440,540,158,'#a7cd95');ctx.fillStyle='#d5dfac';ctx.beginPath();ctx.moveTo(0,396);ctx.bezierCurveTo(280,322,550,337,900,404);ctx.lineTo(900,450);ctx.lineTo(0,450);ctx.fill();
for(const [x,y] of [[65,350],[823,323],[170,422],[720,414],[387,316]]){ctx.strokeStyle='#7caa74';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y-12);ctx.moveTo(x,y);ctx.lineTo(x+7,y-9);ctx.stroke()}for(const [x,y] of [[100,391],[783,385],[590,423]]){SceneLayout.at(ctx,x,y,1,()=>{for(let i=0;i<5;i++)ellipse(Math.cos(i*1.26)*5,Math.sin(i*1.26)*5,4,4,'#fff9e2');ellipse(0,0,3,3,'#efb45f')})}
const bob=reduced?0:Math.sin(t/330)*2;
const runnerX=685+Math.min(runDistance*.3,65);
if([animal,partner].some(a=>a.type==='marine'||a.type==='croc')){ellipse(460,364,490,48,'#7db8c77a');ctx.strokeStyle='#d8edf2';ctx.lineWidth=2;for(let i=0;i<6;i++){ctx.beginPath();ctx.ellipse(110+i*145,366,48,5,0,0,Math.PI);ctx.stroke()}}
if(state==='playing'&&!reduced){ctx.strokeStyle='#b3bf90';ctx.lineWidth=5;ctx.lineCap='round';for(let i=0;i<8;i++){const x=((i*140-runDistance)%1120+1120)%1120-110;ctx.beginPath();ctx.moveTo(x,390);ctx.lineTo(x+22,390);ctx.stroke()}}
dino(runnerX,340,1.1,'#e9b960','#f7d995',state==='playing'&&!reduced?Math.abs(Math.sin(t/100))*9:bob,true);
dino(runnerX-130-(1-position)*START_GAP,353,1.16,'#69ac89','#a5d2a1',reduced?0:Math.sin(t/70)*bounce*10+bob);
if(state==='won'){ctx.fillStyle='#e58e85';ctx.font='38px sans-serif';SceneLayout.at(ctx,610,211,1,()=>ctx.fillText('♥',0,0));for(let i=0;i<12;i++){let x=100+i*63,y=130+Math.sin(i*2)*55;SceneLayout.at(ctx,x,y,1,()=>{ctx.rotate(i);ctx.fillStyle=['#ecb159','#e89797','#78b59a'][i%3];ctx.fillRect(-4,-4,8,12)})}}ctx.restore()}
function frame(t){let dt=Math.min((t-last)||16,100);last=t;if(state==='playing'&&!document.hidden){const distance=ESCAPE_SPEED*dt/1000;runDistance+=distance;gap=Math.min(MAX_GAP,gap+distance);target=1-gap/START_GAP;updateProgress()}position+=(target-position)*(reduced?1:Math.min(1,dt/110));bounce=Math.max(0,bounce-dt/500);draw(t);requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden&&audio)audio.suspend();else if(audio&&soundOn)audio.resume()});reset();requestAnimationFrame(frame);
</script>
</body>
</html>
