<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f6ec"><title>きょうりゅう あわせ | しんけいすいじゃく</title><link rel="stylesheet" href="clear-v5.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f9f6ec;color:#304d3e;font-family:ui-rounded,'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif}button,a,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation;font:inherit}button:focus-visible,a:focus-visible,select:focus-visible{outline:4px solid #71905b;outline-offset:3px}[hidden]{display:none!important}.app{max-width:1000px;margin:auto;padding:20px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}header a,header button{border:1px solid #d7dfc8;background:#fffdf6;color:#45613d;padding:12px;border-radius:17px;text-decoration:none;min-height:48px}h1{text-align:center;font-size:clamp(25px,5vw,38px);margin:20px 0 8px}.intro{text-align:center;color:#76806a;font-size:14px;margin:0 0 14px}.status{text-align:center;font-weight:bold;min-height:30px;margin:12px 0}.board{position:relative;max-width:760px;margin:auto;overflow:clip}.memory-card{position:absolute;border:4px solid #b7b4a9;border-radius:15px;background:#faf8f0;transform:rotate(var(--angle));padding:3px;box-shadow:0 4px 0 #304d3e20;cursor:pointer;overflow:hidden;user-select:none;transition:transform .15s}.memory-card:active{transform:rotate(var(--angle)) scale(.96)}.memory-card .back{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(19px,3.5vw,32px);line-height:1;color:#a09c90}.memory-card.revealed{border-color:var(--edge);background:var(--tint)}.memory-card canvas{width:100%;height:100%;object-fit:contain;display:block;visibility:hidden}.memory-card.revealed .back,.memory-card.matched .back{display:none}.memory-card.revealed canvas,.memory-card.matched canvas{visibility:visible}.memory-card.matched{box-shadow:0 0 0 3px #91b873;cursor:default}.memory-card.matched:after{content:'✓';position:absolute;right:4px;top:0;color:#466e3f;font-weight:bold;background:#fff9e6;border-radius:50%;width:20px;height:20px;text-align:center}.settings{max-width:430px;margin:18px auto;padding:20px;background:#fffdf6;border:2px solid #d8dfca;border-radius:22px}.settings label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:bold}.settings select{padding:12px;border:2px solid #91a17f;border-radius:12px;background:white;max-width:70%}.settings button{width:100%;margin-top:12px;border:0;border-radius:16px;padding:15px;background:#e9b45e;color:#3e4931;font-weight:bold;cursor:pointer}@media(max-height:500px) and (orientation:landscape){.app{padding:10px 18px}h1{font-size:23px;margin:5px 0}.intro{margin:2px}.status{margin:5px 0;min-height:22px}.board{max-width:800px}.memory-card{border-radius:13px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
