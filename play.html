<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9f6ec">
<meta name="description" content="大きなボタンをぽん！2歳から遊べる、やさしい恐竜の追いかけっこ。時間制限もゲームオーバーもありません。">
<title>きょうりゅうと あそぼ</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f9f6ec;color:#304d3e;font-family:ui-rounded,'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:4px solid #355fbb;outline-offset:5px}.app{max-width:1060px;margin:auto;padding:22px 26px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:16px;font-weight:800;letter-spacing:.08em}.brand span{background:#deead7;border-radius:12px;padding:8px;margin-right:8px}.sound{border:1px solid #d9dfcf;background:#fffdf6;border-radius:24px;padding:12px 16px;font-size:14px;color:#425d46;min-height:48px}h1{font-size:clamp(26px,5vw,43px);letter-spacing:.07em;text-align:center;margin:23px 0 8px;line-height:1.4}.intro{text-align:center;color:#76806a;margin:0 0 20px;font-size:15px}.world{position:relative;border:7px solid #fffdf6;border-radius:32px;overflow:hidden;background:#dff2ed;box-shadow:0 8px 0 #ececde}canvas{display:block;width:100%;aspect-ratio:1.9;max-height:440px}.status{position:absolute;left:50%;top:16px;transform:translateX(-50%);border-radius:25px;background:#fffdf3ef;padding:11px 22px;white-space:nowrap;font-weight:800;font-size:clamp(16px,3vw,23px);box-shadow:0 3px 0 #385b3910}.progress{display:flex;justify-content:center;gap:13px;margin:22px 0 14px}.dot{width:14px;height:14px;background:#e0e2d3;border-radius:50%;transition:background .2s,transform .2s}.dot.on{background:#eeab55;transform:scale(1.13)}.controls{text-align:center}.go{min-height:103px;min-width:260px;max-width:100%;padding:13px 44px;border:0;border-radius:32px;background:#efb45f;color:#3e4931;box-shadow:0 7px 0 #cd9041;font-size:29px;font-weight:900;letter-spacing:.08em;transition:transform .1s,box-shadow .1s}.go:active{transform:translateY(5px);box-shadow:0 2px 0 #cd9041}.go svg{width:37px;height:39px;vertical-align:middle;margin-right:14px}.hint{color:#7b826f;font-size:14px;line-height:1.8;margin:19px 0 0}footer{text-align:center;font-size:12px;color:#929884;margin-top:22px}.restart{display:block;margin:15px auto 0;background:none;border:0;color:#78836c;text-decoration:underline;padding:10px;font-size:13px}@media(max-width:600px){.app{padding:16px 12px}.brand{font-size:12px;letter-spacing:0}.sound{font-size:12px;padding:10px}h1{margin-top:23px}.intro{font-size:13px}canvas{aspect-ratio:1.15}.world{border-width:5px;border-radius:25px}.status{top:14px;padding:10px 15px}.go{width:90%;min-height:106px;padding:13px 18px;font-size:24px;letter-spacing:.02em;white-space:nowrap}.hint{font-size:12px}footer{margin-top:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><span>🦕</span>ちいさな きょうりゅうの もり</div><button class="sound" id="sound" aria-pressed="false">♪ おと：なし</button></header>
<nav style="margin-top:20px"><a href="./" style="color:#426a50;display:inline-block;padding:12px 18px;background:#fffdf6;border-radius:20px;text-decoration:none;font-weight:bold">← あそびを えらぶ</a></nav><h1>きょうりゅうと あそぼ</h1><p class="intro">おおきな ボタンを ぽん！</p>
<section class="world" aria-label="緑の恐竜が黄色い恐竜を追いかける草原"><canvas id="scene" aria-label="にこにこした恐竜のおともだち"></canvas><div class="status" id="status" role="status" aria-live="polite">いっしょに あそぼ！</div></section>
<div class="progress" aria-label="6歩でお友だちに追いつきます" id="progress"></div>
<div class="controls"><button class="go" id="go"><svg viewBox="0 0 40 44" aria-hidden="true"><g fill="currentColor"><ellipse cx="20" cy="30" rx="12" ry="11" transform="rotate(-10 20 30)"/><ellipse cx="7" cy="15" rx="5" ry="7" transform="rotate(-25 7 15)"/><ellipse cx="19" cy="8" rx="5" ry="7"/><ellipse cx="31" cy="13" rx="5" ry="7" transform="rotate(25 31 13)"/></g></svg><span id="label">あそぶ！</span></button><p class="hint" id="hint">おおきな ボタンを ぽん！<br>ゆっくりで だいじょうぶ。</p><button class="restart" id="restart" hidden>はじめから</button></div>
<footer>2さいからの きょうりゅうあそび · じかんせいげん なし</footer>
</main>
<script>
'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),go=document.querySelector('#go'),label=document.querySelector('#label'),statusText=document.querySelector('#status'),hint=document.querySelector('#hint'),restart=document.querySelector('#restart'),sound=document.querySelector('#sound');
const mode=new URLSearchParams(location.search).get('game')==='food'?'food':'egg';
const game=mode==='egg'?{title:'たまご ぱかっ',total:4,action:'こんこん！',ready:'だれが うまれるかな？',play:'たまごを こんこん！',win:'ぱかっ！ はじめまして！',hint:'たまごを やさしく こんこん！',done:'あかちゃんきょうりゅうに あえたね！'}:{title:'もぐもぐ ごはん',total:5,action:'はっぱ どうぞ！',ready:'おなかが ぺこぺこ！',play:'はっぱを どうぞ！',win:'もぐもぐ！ ごちそうさま！',hint:'はっぱの ボタンを おしてね。',done:'いっぱい たべたね！ ありがとう！'};
document.title=game.title+' | きょうりゅうと あそぼ';document.querySelector('h1').textContent=game.title;document.querySelector('.intro').textContent=game.hint;document.querySelector('.world').setAttribute('aria-label',game.title);canvas.setAttribute('aria-label',mode==='egg'?'卵から赤ちゃん恐竜が生まれます':'恐竜が葉っぱを食べます');document.querySelector('#progress').setAttribute('aria-label',game.total+'回でできあがり');document.querySelector('.go svg').innerHTML=mode==='egg'?'<ellipse cx="20" cy="24" rx="14" ry="18" fill="#fff4d6"/><path d="m19 7-3 12 8 5-7 12" fill="none" stroke="currentColor" stroke-width="2"/>':'<ellipse cx="20" cy="22" rx="13" ry="20" fill="#4f986b" transform="rotate(25 20 22)"/><path d="m10 41 18-36" stroke="#d4e5a3" stroke-width="3"/>';
let state='ready',steps=0,position=0,target=0,last=0,bounce=0,soundOn=false,audio;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dots=Array.from({length:game.total},()=>{let d=document.createElement('span');d.className='dot';document.querySelector('#progress').append(d);return d});
function tone(win=false){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();(win?[523,659,784]:[392,523]).forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.075,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.25)})}catch{}}
sound.onclick=()=>{soundOn=!soundOn;sound.textContent=soundOn?'♪ おと：あり':'♪ おと：なし';sound.setAttribute('aria-pressed',String(soundOn));if(soundOn)tone()};
function reset(){state='ready';steps=0;target=0;position=0;bounce=0;label.textContent='あそぶ！';statusText.textContent=game.ready;hint.textContent=game.hint;restart.hidden=true;dots.forEach(d=>d.classList.remove('on'));draw(0)}
function start(){reset();state='playing';label.textContent=game.action;statusText.textContent=game.play;restart.hidden=false}
restart.onclick=reset;
go.onclick=()=>{if(state==='ready'||state==='won'){start();tone();return}steps++;target=steps/game.total;bounce=1;dots[steps-1].classList.add('on');tone(steps===game.total);if(steps===game.total){state='won';label.textContent='もう いっかい！';statusText.textContent=game.win;hint.textContent=game.done}else{statusText.textContent=mode==='egg'?'ぴきぴき！ もうすこし！':'もぐもぐ！ おいしいね！'}};
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function path(points,c){ctx.fillStyle=c;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
function cloud(x,y,s){ellipse(x,y,36*s,13*s,'#fffdf2');ellipse(x-12*s,y-8*s,19*s,15*s,'#fffdf2');ellipse(x+11*s,y-13*s,20*s,19*s,'#fffdf2')}
function dino(x,y,s,color,belly,walk,friend=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,10,65,10,'#557b4320');ctx.translate(0,-walk);path([[-40,-40],[-90,-49],[-67,-19],[-32,-14]],color);for(let i=0;i<4;i++)path([[-45+i*16,-61],[-39+i*16,-79],[-29+i*16,-61]],friend?'#cd934d':'#4e9977');ellipse(-10,-39,50,36,color);ellipse(6,-31,29,24,belly);ctx.fillStyle=color;ctx.fillRect(-36,-25,20,29);ctx.fillRect(13,-25,20,29);ellipse(-26,3,14,7,color);ellipse(25,3,14,7,color);ellipse(33,-69,25,41,color);ellipse(49,-90,35,27,color);ellipse(71,-85,18,17,color);ellipse(47,-96,4,5,'#304d3e');ellipse(48,-98,1.3,1.5,'white');ellipse(62,-83,7,4,friend?'#e9a178':'#eaa5a0');ctx.strokeStyle='#304d3e';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();ctx.arc(73,-88,8,.25,1.6);ctx.stroke();ellipse(29,-39,13,7,color);ctx.restore()}
function draw(t){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const sx=w/900,sy=h/450;ctx.save();ctx.scale(sx,sy);ctx.fillStyle='#dff2ed';ctx.fillRect(0,0,900,450);ellipse(754,81,32,32,'#f4cf79');cloud(151,89,.9);cloud(545,108,.75);ellipse(160,370,300,165,'#bbd9ab');ellipse(702,383,370,182,'#c9dfaf');ellipse(428,440,540,158,'#a7cd95');ctx.fillStyle='#d5dfac';ctx.beginPath();ctx.moveTo(0,396);ctx.bezierCurveTo(280,322,550,337,900,404);ctx.lineTo(900,450);ctx.lineTo(0,450);ctx.fill();
for(const [x,y] of [[65,350],[823,323],[170,422],[720,414],[387,316]]){ctx.strokeStyle='#7caa74';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y-12);ctx.moveTo(x,y);ctx.lineTo(x+7,y-9);ctx.stroke()}for(const [x,y] of [[100,391],[783,385],[590,423]]){for(let i=0;i<5;i++)ellipse(x+Math.cos(i*1.26)*5,y+Math.sin(i*1.26)*5,4,4,'#fff9e2');ellipse(x,y,3,3,'#efb45f')}
const bob=reduced?0:Math.sin(t/330)*2;
if(mode==='egg'){
 ellipse(450,365,135,24,'#9cb67f');
 if(state==='won'){dino(450,340,1.35,'#a197ce','#d2c5e5',bob);path([[340,346],[360,324],[380,344],[400,320],[420,345],[440,325],[460,345],[460,380],[350,380]],'#fff4d6');path([[510,346],[530,324],[550,344],[570,320],[590,345],[605,380],[510,380]],'#fff4d6')}
 else{ctx.save();ctx.translate(450,270);ctx.rotate(reduced?0:Math.sin(t/70)*bounce*.06);ellipse(0,0,92,111,'#fff4d6');ellipse(-29,-45,16,22,'#d5d0ac');ellipse(38,-4,21,15,'#d5d0ac');ellipse(-25,53,18,13,'#d5d0ac');if(steps){ctx.strokeStyle='#b18f66';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-6,-105);for(let i=0;i<steps*2;i++)ctx.lineTo((i%2?12:-12),-85+i*19);ctx.stroke()}ctx.restore()}
}else{
 dino(388,360,1.9,'#69ac89','#a5d2a1',reduced?0:bob+bounce*Math.sin(t/65)*5);
 ellipse(690,367,95,22,'#fef7e2');
 for(let i=0;i<game.total-steps;i++){ctx.save();ctx.translate(635+i*24,343-(i%2)*10);ctx.rotate(-.45);ellipse(0,0,13,28,'#4f986b');ctx.strokeStyle='#d4e5a3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(0,24);ctx.stroke();ctx.restore()}
 if(steps>0&&state!=='won'){ctx.fillStyle='#426a50';ctx.font='bold 25px sans-serif';ctx.fillText('もぐもぐ ♪',570,205)}
}

if(state==='won'){ctx.fillStyle='#e58e85';ctx.font='38px sans-serif';ctx.fillText('♥',610,211);for(let i=0;i<12;i++){let x=100+i*63,y=130+Math.sin(i*2)*55;ctx.save();ctx.translate(x,y);ctx.rotate(i);ctx.fillStyle=['#ecb159','#e89797','#78b59a'][i%3];ctx.fillRect(-4,-4,8,12);ctx.restore()}}ctx.restore()}
function frame(t){let dt=Math.min((t-last)||16,50);last=t;position+=(target-position)*(reduced?1:Math.min(1,dt/110));bounce=Math.max(0,bounce-dt/500);draw(t);requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden&&audio)audio.suspend();else if(audio&&soundOn)audio.resume()});reset();requestAnimationFrame(frame);
</script>
</body>
</html>
